<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>슈퍼 픽셀 몬스터 배틀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0; padding: 0; overflow: hidden;
            background: #1a1a1a; color: white;
            font-family: 'Press Start 2P', cursive;
            touch-action: none; user-select: none;
        }

        #game-stage {
            display: flex; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #2c3e50, #000000);
            position: relative;
        }

        .side {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            position: relative; z-index: 1;
        }

        /* 캐릭터 이미지 및 애니메이션 */
        .char-wrapper { position: relative; transition: transform 0.1s; }
        .character { width: 180px; height: auto; image-rendering: pixelated; }

        /* 타격 효과 */
        .dmg-text {
            position: absolute; color: #ffeb3b; font-size: 20px;
            animation: floatUp 0.8s forwards; pointer-events: none;
            text-shadow: 2px 2px #000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* 체력바 디자인 */
        .ui-box { width: 80%; margin-bottom: 20px; text-align: center; }
        .hp-bg { height: 25px; background: #444; border: 4px solid #fff; position: relative; }
        .hp-fill { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
        .name-tag { margin-bottom: 10px; font-size: 12px; }

        /* 필살기 게이지 */
        .sp-bg { height: 10px; background: #222; margin-top: 5px; border: 2px solid #fff; }
        .sp-fill { height: 100%; background: #e91e63; width: 0%; transition: width 0.1s; }

        /* 화면 흔들림 */
        .shake { animation: shakeAnim 0.2s; }
        @keyframes shakeAnim {
            0% { transform: translate(2px, 2px); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        /* 필살기 연출 */
        #special-fx {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 10;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        button {
            padding: 20px 40px; font-family: 'Press Start 2P';
            background: #ff5722; color: white; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-stage">
    <div id="special-fx"></div>
    
    <div class="side" onclick="doAction('left')">
        <div class="ui-box">
            <div class="name-tag">ONI BOMBER</div>
            <div class="hp-bg"><div id="hp-l" class="hp-fill"></div></div>
            <div class="sp-bg"><div id="sp-l" class="sp-fill"></div></div>
        </div>
        <div id="wrapper-l" class="char-wrapper">
            <img src="oni.png" class="character">
        </div>
    </div>

    <div class="side" onclick="doAction('right')">
        <div class="ui-box">
            <div class="name-tag">HARMONY GARDEN</div>
            <div class="hp-bg"><div id="hp-r" class="hp-fill"></div></div>
            <div class="sp-bg"><div id="sp-r" class="sp-fill"></div></div>
        </div>
        <div id="wrapper-r" class="char-wrapper">
            <img src="harmony.png" class="character">
        </div>
    </div>
</div>

<div id="overlay">
    <h1 id="win-msg"></h1>
    <button onclick="location.reload()">REMATCH</button>
</div>

<audio id="snd-hit" src="https://actions.google.com/sounds/v1/cartoon/clap.ogg"></audio>
<audio id="snd-special" src="https://actions.google.com/sounds/v1/science_fiction/low_fuzz_hum.ogg"></audio>

<script>
    let stats = {
        left: { hp: 100, sp: 0 },
        right: { hp: 100, sp: 0 }
    };

    function doAction(attacker) {
        if (stats.left.hp <= 0 || stats.right.hp <= 0) return;

        const target = attacker === 'left' ? 'right' : 'left';
        const isSpecial = stats[attacker].sp >= 100;
        
        // 데미지 계산
        let dmg = isSpecial ? Math.floor(Math.random() * 15) + 15 : Math.floor(Math.random() * 8) + 3;
        stats[target].hp -= dmg;
        if (stats[target].hp < 0) stats[target].hp = 0;

        // 게이지 충전
        if (!isSpecial) stats[attacker].sp += 10;
        else stats[attacker].sp = 0;

        // UI 업데이트
        render(attacker, target, dmg, isSpecial);
        checkGameOver();
    }

    function render(atk, tar, dmg, isSpecial) {
        // HP/SP 바
        document.getElementById(`hp-${tar[0]}`).style.width = stats[tar].hp + '%';
        document.getElementById(`sp-${atk[0]}`).style.width = stats[atk].sp + '%';

        // 데미지 텍스트 생성
        const tarWrapper = document.getElementById(`wrapper-${tar[0]}`);
        const dmgTag = document.createElement('div');
        dmgTag.className = 'dmg-text';
        dmgTag.innerText = isSpecial ? `CRITICAL! -${dmg}` : `-${dmg}`;
        tarWrapper.appendChild(dmgTag);
        setTimeout(() => dmgTag.remove(), 800);

        // 연출
        const stage = document.getElementById('game-stage');
        const atkWrapper = document.getElementById(`wrapper-${atk[0]}`);
        
        // 공격 모션
        atkWrapper.style.transform = atk === 'left' ? 'translateX(50px)' : 'translateX(-50px)';
        setTimeout(() => atkWrapper.style.transform = 'none', 100);

        // 피격 효과
        stage.classList.add('shake');
        setTimeout(() => stage.classList.remove('shake'), 200);

        // 사운드 및 특수효과
        if (isSpecial) {
            document.getElementById('snd-special').play();
            const fx = document.getElementById('special-fx');
            fx.style.opacity = '0.5';
            setTimeout(() => fx.style.opacity = '0', 200);
        } else {
            const hitSnd = document.getElementById('snd-hit').cloneNode();
            hitSnd.play();
        }
    }

    function checkGameOver() {
        if (stats.left.hp <= 0 || stats.right.hp <= 0) {
            const winner = stats.left.hp > 0 ? 'ONI BOMBER' : 'HARMONY GARDEN';
            document.getElementById('win-msg').innerText = winner + " WINS!";
            document.getElementById('overlay').style.display = 'flex';
        }
    }
</script>
</body>
</html>
